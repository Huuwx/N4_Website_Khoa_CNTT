# Cấu hình MySQL
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ptda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: "Trong2004@"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# Server
server:
  port: 8080

# Logging
logging:
  level:
    org:
      springframework:
        web: INFO
      hibernate: ERROR
    com:
      example: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
